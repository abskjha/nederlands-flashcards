<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dutch Flashcards</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .app { width: min(780px, 100%); }
    h1 { text-align: center; margin: 0 0 14px; font-size: 28px; }
    .card {
      background: white;
      border-radius: 22px;
      padding: 30px;
      min-height: 360px;
      box-shadow: 0 18px 50px rgba(20, 30, 60, 0.12);
      cursor: pointer;
      user-select: none;
      border: 1px solid #e7e9f2;
    }
    .label {
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 13px;
      font-weight: 700;
      color: #68758c;
    }
    .prompt {
      font-size: clamp(36px, 8vw, 72px);
      line-height: 1.05;
      font-weight: 800;
      margin: 24px 0 8px;
      word-break: break-word;
    }
    .answer {
      display: none;
      margin-top: 26px;
      border-top: 1px solid #e7e9f2;
      padding-top: 22px;
    }
    .revealed .answer { display: block; }
    .answer-main {
      font-size: clamp(30px, 6vw, 54px);
      font-weight: 800;
      margin-bottom: 18px;
      color: #0f5132;
      word-break: break-word;
    }
    .reveal-map {
      margin: 4px 0 22px;
      padding: 18px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #e7e9f2;
    }
    .word-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.8vw, 12px);
      flex-wrap: nowrap;
      text-align: center;
      width: 100%;
      overflow: hidden;
      min-width: 0;
    }
    .word-box {
      display: inline-block;
      min-width: 0;
      flex: 0 0 auto;
      max-width: none;
    }
    .word-form {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      font-size: var(--reveal-word-size, clamp(24px, 5.4vw, 52px));
      font-weight: 850;
      line-height: 1.05;
      white-space: nowrap;
      word-break: normal;
      max-width: 100%;
    }
    .word-token {
      display: inline-block;
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }
    .article {
      font-size: .62em;
      font-weight: 900;
      text-transform: lowercase;
    }
    .article.de { color: #d62828; }
    .article.het { color: #1565c0; }
    .word-number {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #68758c;
      text-transform: lowercase;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .transform {
      display: inline-grid;
      grid-template-rows: auto auto;
      place-items: center;
      flex: 0 0 auto;
      min-width: clamp(54px, 10vw, 92px);
      color: #556174;
      margin: 0 2px;
    }
    .transform-label {
      font-size: var(--transform-label-size, 12px);
      font-weight: 800;
      color: #68758c;
      margin-bottom: -2px;
      white-space: nowrap;
    }
    .arrow {
      font-size: var(--arrow-size, clamp(24px, 5vw, 34px));
      line-height: 1;
      letter-spacing: -4px;
    }
    .meaning-drop {
      display: grid;
      justify-items: center;
      margin-top: 16px;
      color: #0f5132;
      text-align: center;
    }
    .diag-arrow {
      font-size: 30px;
      line-height: 1;
      color: #778399;
      transform: rotate(-8deg);
      margin-bottom: 2px;
    }
    .meaning-text {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 850;
      line-height: 1.1;
      word-break: break-word;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
    th, td { border-bottom: 1px solid #edf0f5; padding: 9px 6px; text-align: left; vertical-align: top; }
    th { width: 34%; color: #59667a; font-weight: 700; }
    .counter { text-align: center; color: #69758a; margin-top: 12px; font-size: 14px; }
    .error { background: #fff3f3; color: #8a1f1f; padding: 16px; border-radius: 14px; }
    @media (max-width: 520px) {
      .card { padding: 22px; min-height: 330px; }
      th, td { display: block; width: 100%; }
      th { border-bottom: 0; padding-bottom: 2px; }
      td { padding-top: 0; }
    }

    .translation-row th, .translation-row td {
      color: #4f5d73;
      font-size: 14px;
      background: #fbfcff;
    }
    .translation-row td {
      font-style: italic;
    }


    .pronounce-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 14px 0 4px;
    }
    .sound-btn {
      border: 1px solid #d8deea;
      background: #f8fafc;
      color: #172033;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(20, 30, 60, 0.06);
    }
    .sound-btn:hover { background: #eef3ff; }
    .sound-btn:active { transform: translateY(1px); }
    .sound-note {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }
  </style>
</head>
<body>

    <h1>Dutch Flashcards</h1>

    </section>
    <div class="counter" id="counter"></div>
  </main>

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function pickRandomCard() {
      const item = DICTIONARY[Math.floor(Math.random() * DICTIONARY.length)];
      const mode = Math.random() < 0.5 ? "dutch" : "english";
      return { item, mode };
    }

    function cleanValue(value) {
      const text = String(value ?? "").trim();
      return text === "—" ? "" : text;
    }

    function articleFrom(entry) {
      const full = cleanValue(entry["de/het + word"]);
      const match = full.match(/^(de|het)\s+/i);
      if (!match) return "";
      return match[1].toLowerCase();
    }

    function articleSpan(article) {
      if (article !== "de" && article !== "het") return "";
      return `<span class="article ${esc(article)}">${esc(article)}</span>`;
    }

    function wordBlock(entry) {
      const article = articleFrom(entry);
      const number = cleanValue(entry["Singular or plural"]);
      const word = cleanValue(entry["Word"]);
      return `
        <span class="word-box">
          <span class="word-form">${articleSpan(article)}<span class="word-token">${esc(word || "—")}</span></span>
          ${number ? `<span class="word-number">${esc(number)}</span>` : ""}
        </span>
      `;
    }

    function findLinkedForm(entry) {
      const target = cleanValue(entry["Singular/plural or verb-person form"]);
      if (!target || target.toLowerCase() === "infinitive") return null;
      const firstTarget = target.split("/")[0].trim();
      if (!firstTarget || firstTarget === cleanValue(entry["Word"])) return null;
      return DICTIONARY.find(row => cleanValue(row["Word"]).toLowerCase() === firstTarget.toLowerCase()) || {
        "Word": firstTarget,
        "de/het + word": "",
        "Singular or plural": cleanValue(entry["Singular or plural"]).toLowerCase() === "singular" ? "plural" : (cleanValue(entry["Singular or plural"]).toLowerCase() === "plural" ? "singular" : "")
      };
    }

    function transformLabel(entry, linked) {
      const from = cleanValue(entry["Singular or plural"]);
      const to = cleanValue(linked?.["Singular or plural"]);
      if (from && to && from !== to) return `${from} → ${to}`;
      return "form";
    }

    function fitRevealLine() {
      const line = answerEl.querySelector(".word-line");
      if (!line) return;

      // Never truncate the Dutch words. Keep the whole transformation on one line
      // by reducing the font sizes until the row fits the available card width.
      let wordSize = Math.min(52, Math.max(26, Math.round(window.innerWidth * 0.054)));
      let labelSize = 12;
      let arrowSize = Math.min(34, Math.max(24, Math.round(window.innerWidth * 0.05)));
      const minWordSize = 10;
      const minLabelSize = 8;
      const minArrowSize = 16;

      const applySizes = () => {
        line.style.setProperty("--reveal-word-size", wordSize + "px");
        line.style.setProperty("--transform-label-size", labelSize + "px");
        line.style.setProperty("--arrow-size", arrowSize + "px");
      };

      applySizes();
      let guard = 0;
      while (line.scrollWidth > line.clientWidth && wordSize > minWordSize && guard < 80) {
        wordSize -= 1;
        if (wordSize < 20 && labelSize > minLabelSize) labelSize -= 0.25;
        if (wordSize < 18 && arrowSize > minArrowSize) arrowSize -= 0.5;
        applySizes();
        guard += 1;
      }

      // Last resort for very small mobile screens: keep full words readable and
      // allow the card itself to breathe horizontally rather than clipping text.
      line.style.overflow = "visible";
    }

      const wordText = cleanValue(entry["Word"]);

            ${ex1 ? `<button type="button" class="sound-btn" data-speak="${esc(ex1)}" title="Pronounce example sentence 1">🔊 Example 1</button>` : ""}
            ${ex2 ? `<button type="button" class="sound-btn" data-speak="${esc(ex2)}" title="Pronounce example sentence 2">🔊 Example 2</button>` : ""}
            <button type="button" class="sound-btn" data-google-speak="${esc(wordText)}" title="Try Google Translate Dutch pronunciation audio online">🌐 Google</button>
          </div>
          <div class="sound-note">Pronunciation uses your browser’s Dutch voice first; Google audio is available when online and allowed by the browser.</div>
          <div class="meaning-drop">
            <div class="diag-arrow">↘</div>
            <div class="meaning-text">${esc(cleanValue(entry["English meaning"]) || "—")}</div>
          </div>
        </div>
      `;
    }



    function getDutchVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      return voices.find(v => /^nl[-_]/i.test(v.lang))
        || voices.find(v => /Dutch|Nederlands/i.test(v.name))
        || null;
    }

    function speakWithBrowserDutch(text) {
      const phrase = cleanValue(text);
      if (!phrase) return false;
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return false;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.lang = 'nl-NL';
      utterance.rate = 0.86;
      utterance.pitch = 1;
      const voice = getDutchVoice();
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
      return true;
    }

    function speakWithGoogleDutch(text) {
      const phrase = cleanValue(text);
      if (!phrase) return;
      // Unofficial Google Translate TTS endpoint. It works only when the browser
      // is online and Google allows the request. The built-in browser voice is
      // used first elsewhere, so the app still works offline when nl-NL voices exist.
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=nl&q=' + encodeURIComponent(phrase.slice(0, 180));
      const audio = new Audio(url);
      audio.play().catch(() => {
        // Fallback again to browser speech if Google audio is blocked.
        speakWithBrowserDutch(phrase);
      });
    }

    function pronounceDutch(text) {
      if (!speakWithBrowserDutch(text)) {
        speakWithGoogleDutch(text);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    answerEl.addEventListener('click', (event) => {
      const speakButton = event.target.closest('[data-speak], [data-google-speak]');
      if (!speakButton) return;
      event.stopPropagation();
      event.preventDefault();
      if (speakButton.dataset.googleSpeak) {
        speakWithGoogleDutch(speakButton.dataset.googleSpeak);
      } else {
        pronounceDutch(speakButton.dataset.speak);
      }
    });

    function render(state) {
      current = state.item;
      currentMode = state.mode;
      card.classList.remove("revealed");

      const promptValue = currentMode === "dutch"
        ? current["Word"]
        : current["English meaning"];

      sideLabel.textContent = currentMode === "dutch" ? "Dutch" : "English";
      promptEl.textContent = promptValue || "—";

      const rows = columns
        .filter(col => col in current && String(current[col] ?? "").trim() !== "")
        .map(col => `<tr class="${col.startsWith('Translation') ? 'translation-row' : ''}"><th>${esc(col)}</th><td>${esc(current[col])}</td></tr>`)
        .join("");

      answerEl.innerHTML = `
        ${renderRevealTop(current)}
        <table>${rows}</table>
      `;

      counterEl.textContent = `${DICTIONARY.length} cards`;
      requestAnimationFrame(fitRevealLine);
    }

    function nextCard() {
      const state = pickRandomCard();
      history = history.slice(0, historyIndex + 1);
      history.push(state);
      historyIndex = history.length - 1;
      render(state);
    }

    function previousCard() {
      if (historyIndex > 0) {
        historyIndex -= 1;
        render(history[historyIndex]);
      }
    }

    function revealCard() {
      card.classList.add("revealed");
    }

    function hideReveal() {
      card.classList.remove("revealed");
    }

    function isRevealed() {
      return card.classList.contains("revealed");
    }

    function forwardStep() {
      if (isRevealed()) {
        nextCard();
      } else {
        revealCard();
      }
    }

    function backwardStep() {
      if (isRevealed()) {
        hideReveal();
      } else {
        previousCard();
      }
    }

    function handleClick() {
      clickCount += 1;
      clearTimeout(clickTimer);

      clickTimer = setTimeout(() => {
        if (clickCount === 1) {
          forwardStep();
        } else {
          backwardStep();
        }
        clickCount = 0;
      }, 240);
    }

    card.addEventListener("click", handleClick);
    window.addEventListener("resize", fitRevealLine);

    document.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "Enter" || event.key === "ArrowRight") {
        event.preventDefault();
        forwardStep();
      } else if (event.key === "ArrowLeft" || event.key === "Backspace") {
        event.preventDefault();
        backwardStep();
      }
    });

    try {
      if (!Array.isArray(DICTIONARY) || DICTIONARY.length === 0) {
        throw new Error("Dictionary is empty.");
      }
      nextCard();
    } catch (err) {
      sideLabel.textContent = "Error";
      promptEl.innerHTML = '<div class="error">Could not load dictionary: ' + esc(err.message) + '</div>';
      counterEl.textContent = "";
    }
  </script>
</body>
</html>
